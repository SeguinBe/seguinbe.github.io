---
layout: default
---

<div class="home">

  {{ content }}

</div>

<style>
  html {
    scroll-behavior: smooth;
  }

  /* Offset anchor targets so headings aren't obscured */
  h2[id], h3[id], section[id] {
    scroll-margin-top: 70px;
  }

  .home h2 {
    border-bottom: 1px solid #e8e8e8;
    padding-bottom: 6px;
    margin-top: 2.2rem;
    margin-bottom: 1.2rem;
    font-size: 1.6rem;
  }

  details.collapsible-section {
    margin-top: 2.2rem;
    margin-bottom: 1.2rem;
    border-bottom: 1px solid #e8e8e8;
    padding-bottom: 14px;
  }

  details.collapsible-section summary {
    cursor: pointer;
    outline: none;
    user-select: none;
  }

  details.collapsible-section summary h2 {
    border-bottom: none;
    margin-top: 0;
    margin-bottom: 0;
    padding-bottom: 0;
  }

  .home h3 {
    margin-top: 1.6rem;
    margin-bottom: 0.4rem;
    font-size: 1.25rem;
  }

  .home h4 {
    margin-top: 1rem;
    margin-bottom: 0.3rem;
    font-size: 1.05rem;
  }

  .bio-header {
    display: flex;
    flex-direction: row;
    gap: 32px;
    align-items: center;
    margin-bottom: 1.5rem;
  }

  .bio-photo {
    width: 140px;
    height: 140px;
    border-radius: 50%;
    object-fit: cover;
    box-shadow: 0 4px 16px rgba(0,0,0,0.1);
    border: 3px solid #ffffff;
    flex-shrink: 0;
  }

  .bio-details h1 {
    font-size: 1.85rem;
    margin: 0 0 4px 0;
    line-height: 1.2;
    letter-spacing: -0.02em;
  }

  .bio-details .bio-role {
    font-size: 1.05rem;
    font-weight: 500;
    color: #1f2937;
    margin: 0 0 4px 0;
  }

  .bio-details .bio-location {
    font-size: 0.92rem;
    color: #6b7280;
    margin: 0 0 12px 0;
  }

  .bio-links {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
  }

  .bio-badge {
    display: inline-flex;
    align-items: center;
    padding: 4px 12px;
    font-size: 0.85rem;
    font-weight: 500;
    color: #374151 !important;
    background-color: #f3f4f6;
    border: 1px solid #e5e7eb;
    border-radius: 9999px;
    text-decoration: none !important;
    transition: all 0.15s ease-in-out;
  }

  .bio-badge:hover {
    background-color: #e5e7eb;
    color: #111827 !important;
    border-color: #d1d5db;
    transform: translateY(-1px);
  }

  .bio-intro {
    font-size: 1.05rem;
    line-height: 1.7;
    color: #27272a;
    margin-top: 0.5rem;
    margin-bottom: 1.8rem;
  }

  .bio-intro a {
    color: #2563eb;
    text-decoration: none;
    font-weight: 500;
  }

  .bio-intro a:hover {
    text-decoration: underline;
  }

  .project-card {
    background: #fafafa;
    border: 1px solid #eee;
    border-radius: 8px;
    padding: 20px;
    margin-bottom: 24px;
  }

  .project-role {
    color: #555;
    font-size: 0.95rem;
    font-weight: 600;
    margin-top: -2px;
    margin-bottom: 12px;
  }

  .pub-item {
    margin-bottom: 20px;
  }

  .pub-title {
    font-weight: 600;
    font-size: 1rem;
    margin-bottom: 2px;
  }

  .pub-venue {
    font-style: italic;
    color: #555;
    font-size: 0.92rem;
    margin-bottom: 2px;
  }

  .pub-authors {
    color: #444;
    font-size: 0.92rem;
    margin-bottom: 4px;
  }

  .pub-links {
    font-size: 0.88rem;
    margin-top: 4px;
  }

  @media (max-width: 600px) {
    .bio-header {
      flex-direction: column;
      align-items: flex-start;
      gap: 16px;
    }
    .bio-photo {
      width: 100px;
      height: 100px;
    }
  }

  .center-image {
    margin: 0 auto;
    display: block;
  }
</style>
